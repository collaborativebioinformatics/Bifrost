[project]
name = "federated-apis"
version = "0.1.0"
description = "Cross-TRE federated analysis on NVIDIA FLARE (NCFH 2026 hackathon, Team 1)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "duckdb>=1.0",
    "nvflare>=2.5,<2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["adapters", "spec", "server", "tres", "harmonisation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: FLARE simulator end-to-end (needs ~30 s)"]
