# Safe Projects allow-list. An AnalysisSpec whose project_id is not listed here
# is rejected by every adapter before anything is computed (and audited as such).
# `sites: all` or a list of tre_ids that have approved the project.
projects:
  ncfh-2026-demo:
    description: NCFH 2026 hackathon demo -- allele frequency + linear regression
    sites: all
  hackathon-test:
    description: Adapter development and CI
    sites: all
