411" dy="21"></tspan><tspan x="411" dy="21">Private data stays here</tspan><tspan x="411" dy="21"></tspan><tspan x="411" dy="21">Compute locally</tspan><tspan x="411" dy="21">Native API → Safe Output</tspan></text><rect x="555" y="350" width="214" height="190" rx="12" fill="#E5EEFB" stroke="#7BA4D5" stroke-width="2" /><text x="662" y="400.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324D"><tspan x="662" dy="0">TRE 3 · SQL gateway</tspan><tspan x="662" dy="21"></tspan><tspan x="662" dy="21">Private data stays here</tspan><tspan x="662" dy="21"></tspan><tspan x="662" dy="21">Compute locally</tspan><tspan x="662" dy="21">Native API → Safe Output</tspan></text><rect x="274" y="650" width="255" height="84" rx="12" fill="#DFF2EA" stroke="#5CAF91" stroke-width="2" /><text x="401.5" y="687.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324D"><tspan x="401.5" dy="0">Merge + disclosure check</tspan><tspan x="401.5" dy="21">combined result is checked</tspan></text><rect x="600" y="625" width="150" height="68" rx="12" fill="#DFF2EA" stroke="#5CAF91" stroke-width="2" /><text x="675" y="644.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324D"><tspan x="675" dy="0">OK</tspan><tspan x="675" dy="21">released</tspan><tspan x="675" dy="21">automatically</tspan></text><rect x="600" y="725" width="150" height="68" rx="12" fill="#FFF1D9" stroke="#D9A84D" stroke-width="2" /><text x="675" y="754.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324D"><tspan x="675" dy="0">FLAGGED</tspan><tspan x="675" dy="21">statistics withheld</tspan></text><rect x="810" y="725" width="143" height="68" rx="12" fill="#FFF7E8" stroke="#D9A84D" stroke-width="2" /><text x="881.5" y="754.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#17324D"><tspan x="881.5" dy="0">Overseer review</tspan><tspan x="881.5" dy="21">approve or reject</tspan></text><rect 