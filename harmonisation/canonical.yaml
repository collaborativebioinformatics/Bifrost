# Harmonisation map: canonical variable -> local column name per TRE.
# PLACEHOLDER content until the Writer's docs/variables.md arrives; the *shape*
# of this file is fixed. Every site listed under `local:` must exist in sites.yaml.
#
#   type : continuous | binary | genotype
#   unit : free text
#   local: { <tre_id>: <local column name> }

variables:
  age:
    description: Age at baseline
    type: continuous
    unit: years
    local: {hunt: alder, gefion: age_years, brev: AGE}
  sex:
    description: Sex (0 = female, 1 = male)
    type: binary
    unit: ""
    local: {hunt: kjonn, gefion: sex_male, brev: SEX}
  bmi:
    description: Body mass index
    type: continuous
    unit: kg/m2
    local: {hunt: bmi_baseline, gefion: body_mass_index, brev: BMI}
  ldl:
    description: LDL cholesterol
    type: continuous
    unit: mmol/L
    local: {hunt: ldl_kol, gefion: ldl_c, brev: LDL_MMOL}
  sbp:
    description: Systolic blood pressure (regression outcome, placeholder)
    type: continuous
    unit: mmHg
    local: {hunt: systolisk, gefion: sbp_mmhg, brev: SBP}
  snp_rs001:
    description: Genotype dosage of minor allele at rs001 (0/1/2)
    type: genotype
